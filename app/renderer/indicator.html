<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Jarvis indicator</title>
    <style>
      /* The window itself is the frosted glass (OS Acrylic / vibrancy): no box drawn around it. */
      html { background: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; font: 600 13px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #fff; }
      /* Small glass pill: the window is the pill (Windows rounds the corners). */
      body { background: linear-gradient(155deg, #2a2a2a, #1b1b1b); }
      .pill { box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.06); }
      .pill { height: 100%; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; -webkit-app-region: drag; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff8fa3; animation: pulse 1.2s ease-in-out infinite; flex: none; }
      .dot.listen { background: #49d17d; }
      .dot.busy { background: #ffc876; }
      .dot.off { animation: none; background: #a7b0d6; box-shadow: none; }
      .label { font-weight: 700; white-space: nowrap; }
      .time { font-variant-numeric: tabular-nums; color: rgb(255 255 255 / 0.72); }
      .sub { color: rgb(255 255 255 / 0.72); font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
      .meter { flex: 1; height: 6px; border-radius: 3px; background: rgb(255 255 255 / 0.18); overflow: hidden; min-width: 60px; }
      .meter i { display: block; height: 100%; width: 0; background: #ececec; transition: width .1s; }
      button {
        -webkit-app-region: no-drag;
        font: inherit;
        font-weight: 600;
        color: #141414;
        border: 0;
        border-radius: 999px;
        padding: 6px 16px;
        background: #ececec;
        cursor: pointer;
      }
      .hidden { display: none !important; }
      @keyframes pulse { 50% { opacity: .4; } }
    </style>
  </head>
  <body>
    <div class="pill">
      <span id="dot" class="dot"></span>
      <span id="label" class="label">REC</span>
      <span id="time" class="time"></span>
      <span id="sub" class="sub"></span>
      <span id="meter" class="meter hidden"><i id="level"></i></span>
      <button id="action">Stop</button>
    </div>
    <script src="indicator.js"></script>
  </body>
</html>
