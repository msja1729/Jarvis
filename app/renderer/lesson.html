<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:" />
    <title>Jarvis lesson</title>
    <link rel="stylesheet" href="katex/katex.min.css" />
    <link rel="stylesheet" href="lesson.css" />
  </head>
  <body>
    <header id="head">
      <span class="orb" aria-hidden="true"></span>
      <div class="titles">
        <div id="kicker" class="kicker">Jarvis is explaining</div>
        <h1 id="title">Lesson</h1>
      </div>
      <span class="spacer"></span>
      <button id="layout" class="icon" title="Full screen / side (F)" aria-label="Switch between full screen and side">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>
      <button id="close" class="icon" title="Close lesson (Esc)" aria-label="Close lesson">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </header>
    <main id="board"><div id="page"></div><div class="tail"></div></main>
    <footer id="foot">
      <div id="caption" class="caption"></div>
      <div id="progress" class="progress"></div>
      <div class="controls">
        <button id="prev" class="icon" title="Previous step (←)" aria-label="Previous step"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg></button>
        <button id="play" class="play" title="Pause / play (Space)" aria-label="Pause or play">
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" /></svg>
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" /></svg>
          <svg class="i-replay" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" /></svg>
        </button>
        <button id="next" class="icon" title="Next step (→)" aria-label="Next step"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
        <span id="count" class="count">0 / 0</span>
        <span class="spacer"></span>
        <button id="cc" class="chip on" title="Captions (C)">CC</button>
      </div>
    </footer>
    <div id="tip" class="tooltip hidden"></div>
    <script src="lesson.js"></script>
  </body>
</html>
